services:
  - type: web
    name: soal-generator
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    # Render auto-injects PORT; server.js reads process.env.PORT.
    # data/ is gitignored + ephemeral on free tier: enter LLM settings via the
    # in-app Settings tab after deploy (they reset on restart).
